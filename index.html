<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12251e"><title>Admin login · Chauhan Properties</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"></head>
<body><main class="login-page"><section class="login-card"><div class="login-brand"><span class="brand-mark">CP</span><span>Chauhan Properties</span></div><h1>Admin sign in</h1><p>Enter the admin email address to receive a one-time login code.</p><div id="login-notice" aria-live="polite"></div><form id="email-form"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required maxlength="320"></div><button id="send-code" class="button button-primary" type="submit">Send login code</button></form><form id="code-form" class="login-hidden"><div class="field"><label for="code">8-digit code</label><input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required></div><p class="hint">Check your spam folder if the message does not arrive.</p><button class="button button-primary" type="submit">Log in</button><button id="resend-code" class="button button-light" type="button">Resend code</button></form></section></main><script type="module" src="js/pages/login.js"></script></body></html>
