<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12251e"><title>Admin login · Chauhan Properties</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"></head>
<body><main class="login-page"><section class="login-card"><div class="login-brand"><span class="brand-mark">CP</span><span>Chauhan Properties</span></div><h1>Admin sign in</h1><p>Enter your admin email and password to continue.</p><div id="login-notice" aria-live="polite"></div><form id="login-form"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required maxlength="320"></div><div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"></div><button class="button button-primary" type="submit">Log in</button></form></section></main><script type="module" src="js/pages/login.js?v=3"></script></body></html>
